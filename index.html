<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TürkTube</title>
</head>
<body>

  <h1>TürkTube</h1>

  <button>Google ile Giriş Yap</button>

  <h2>Video Yükle</h2>

  <input type="file" accept="video/mp4,video/webm,video/quicktime">

  <input type="text" placeholder="Video başlığı">
  <textarea placeholder="Video açıklaması"></textarea>
  <input type="text" placeholder="Etiketler">

  <button>Video Oluştur</button>

  <h2>Videolar</h2>

  <video width="640" controls>
    <source src="" type="video/mp4">
  </video>

</body>
</html>
